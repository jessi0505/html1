<!DOCTYPE html>
<html>
    <head>
         <title>Firebase_form</title>
         <link rel="stylesheet" href="style.css">
    </head>
    <boby>
         <div class="box">
            <div class="form">
                <h2>Login Form</h2>
                <form>
                    <div class="inputbox">
                        <span>username</span>
                        <input type="text" value="" id="username" placeholder="ex: Jessica" required>
                    </div>
                <div class="inputbox">
                    <span>E-mail</span>
                    <input type="email" value="" id="email" placeholder="ex:jessicalima@gmail.com" required>
                    </div>
            <div class="inputbox">
                <span>Phone Number</span>
                <input type="text"value="" id="phone"  placeholder="31 994657356"required>
            </div>
            <input type="submit" value="submit" class="sub" id="submit">
                </form>
            </div>
         </div>
    </body>  
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getDatabase, ref, set, child} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";
        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries
      
        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCZGxhw59fNRp0dhn8sCbujVLAQlt2wieU",
            authDomain: "edymetal-985a6.firebaseapp.com",
            databaseURL: "https://edymetal-985a6-default-rtdb.firebaseio.com",
            projectId: "edymetal-985a6",
            storageBucket: "edymetal-985a6.firebasestorage.app",
            messagingSenderId: "943374243538",
            appId: "1:943374243538:web:43a1ad39627143e7a23f0b"
        };
      
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        //get ref to database services
        const db = getDatabase(app);

        //CORREÇÃO: "document" digitado corretamente e id referenciado
        document.getElementById("submit").addEventListener('click', function(e){
        
            e.preventDefault();

            set(ref(db, 'jessica/' + document.getElementById("username").value),
            {
                username: document.getElementById("username").value,
                email: document.getElementById("email").value,
                PhoneNumber: document.getElementById("phone").value
            })
            .then(() => {
                alert("Login Sucessful !");
            })
           
        })
      </script>
  </body>
  </html>
